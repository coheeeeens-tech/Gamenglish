<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamenglish – English that sticks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eddc;--ink:#1b2e2a;--coral:#e8694f;--lime:#d4e157;--sky:#82b4da;--gold:#e8b23a;--card:#fffaf0;--line:#1b2e2a33}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14211e;--ink:#f3eddc;--card:#1f332e;--line:#f3eddc33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.d{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.04em;line-height:.95;margin:0}
[hidden]{display:none!important}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 5vw;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:800 18px "Bricolage Grotesque",sans-serif;margin-right:auto}
.logo i{width:38px;height:38px;border-radius:50%;background:var(--lime);color:#1b2e2a;border:2px solid #1b2e2a;display:grid;place-items:center;font-style:normal}
.who{font-weight:700;font-size:15px}
.btn{font:700 16px "DM Sans",sans-serif;background:#1b2e2a;color:#f3eddc;border:0;border-radius:40px;padding:14px 26px;cursor:pointer;box-shadow:5px 5px 0 var(--coral);text-decoration:none;display:inline-block}
.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--coral)}
.btn.o{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 18px;font-size:15px}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;min-height:640px}
.hl{padding:8vh 5vw 6vh;display:flex;flex-direction:column;justify-content:center;gap:26px}
.hl h1{font-size:clamp(54px,9vw,128px);font-weight:800}
.hl h1 em{color:var(--coral);font-style:italic;display:block;margin-left:.6em}
.hr{background:var(--sky);position:relative;overflow:hidden;min-height:440px;border-left:1px solid var(--line)}
.bot{position:absolute;left:50%;top:50%;width:min(300px,70%);aspect-ratio:1/1.5;transform:translate(-50%,-48%)}
.bot .h{position:absolute;left:18%;top:0;width:64%;aspect-ratio:1;border-radius:50%;background:#fffaf0;border:3px solid #1b2e2a;z-index:2}
.bot .h:before,.bot .h:after{content:"";position:absolute;top:44%;width:7px;height:12px;border-radius:50%;background:#1b2e2a;left:30%}
.bot .h:after{left:auto;right:30%}
.bot .h b{position:absolute;left:36%;right:36%;top:62%;height:14px;border-bottom:3px solid #1b2e2a;border-radius:0 0 50% 50%}
.bot .b{position:absolute;left:5%;right:5%;top:42%;bottom:0;background:var(--coral);border:3px solid #1b2e2a;border-radius:45% 45% 22% 22%/30% 30% 14% 14%}
.bot .b span{position:absolute;left:50%;top:32%;transform:translateX(-50%);width:34%;aspect-ratio:1;border-radius:50%;background:var(--lime);border:3px solid #1b2e2a;display:grid;place-items:center;font:800 26px "Bricolage Grotesque",sans-serif;color:#1b2e2a}
.bot .a{position:absolute;top:52%;width:34%;height:15%;background:#fffaf0;border:3px solid #1b2e2a;border-radius:30px;left:-26%;transform:rotate(-24deg);z-index:1}
.bot .a.r{left:auto;right:-26%;transform:rotate(24deg)}
.tag{position:absolute;font:800 18px "Bricolage Grotesque",sans-serif;padding:10px 16px;border:2.5px solid #1b2e2a;border-radius:8px;color:#1b2e2a;box-shadow:4px 4px 0 #1b2e2a;transform:rotate(-6deg)}
.t1{left:7%;top:16%;background:#fffaf0}.t2{right:5%;top:30%;background:var(--lime);transform:rotate(7deg)}.t3{left:8%;bottom:14%;background:var(--coral);color:#fffaf0;transform:rotate(5deg)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:24px;padding:clamp(18px,3.5vw,34px);box-shadow:7px 7px 0 var(--ink)}
label{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
input,textarea{width:100%;font:500 17px "DM Sans",sans-serif;padding:13px 15px;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink)}
textarea{font:500 13px ui-monospace,Menlo,monospace;height:120px}
.err{color:var(--coral);font-weight:700;min-height:26px;margin:10px 0 0}
.app{max-width:980px;margin:0 auto;padding:30px 5vw 60px}
.app h2{font-size:clamp(36px,5vw,58px);font-weight:800}
.sub{opacity:.75;margin:6px 0 20px}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border:2.5px solid var(--ink);border-radius:22px;background:var(--card);margin-bottom:12px}
.pill{font:800 17px "Bricolage Grotesque",sans-serif;padding:10px 20px;border-radius:14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 24px;border-bottom:2px solid var(--line)}
.tab{font:700 16px "DM Sans",sans-serif;padding:10px 16px;border:0;background:transparent;color:var(--ink);opacity:.65;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tab[aria-pressed=true]{opacity:1;border-bottom-color:var(--coral)}
.res{display:flex;gap:16px;align-items:center;border:2.5px solid var(--ink);border-radius:18px;padding:16px 18px;background:var(--card);margin-bottom:12px}
.res .ic{font-size:30px}.res .rb{flex:1;min-width:0}.res b{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}.res p{margin:2px 0 0;opacity:.75;font-size:15px}
.empty{border:2.5px dashed var(--ink);border-radius:18px;padding:30px;text-align:center;opacity:.8}
.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;margin-bottom:16px}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:24px}
.bar div{height:100%;width:0;background:var(--lime);transition:width .3s}
.q{font:800 clamp(24px,4.5vw,38px)/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.hint{opacity:.7;margin:8px 0 20px;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:500 18px "DM Sans",sans-serif;text-align:left;padding:15px 18px;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--sky);color:#1b2e2a}
.opt.ok{background:var(--lime);color:#1b2e2a}.opt.no{background:var(--coral);color:#fffaf0}
.fb{min-height:56px;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fb b{font:800 22px "Bricolage Grotesque",sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.st{border:2.5px solid var(--ink);border-radius:18px;padding:16px;background:var(--card)}
.st b{display:block;font:800 40px "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
select{font:500 16px "DM Sans",sans-serif;padding:9px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;padding:8px;border:2.5px dashed var(--ink);border-radius:14px;margin:10px 0}
.chip{font:700 18px "DM Sans",sans-serif;padding:8px 14px;border:2.5px solid var(--ink);border-radius:12px;background:var(--sky);color:var(--ink);cursor:pointer}.chip.on{background:var(--lime)}
.xstat{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;font-weight:700}
.badge{display:inline-block;border:2px solid var(--ink);border-radius:30px;padding:5px 16px;background:var(--card);font-weight:800;font-size:16px}
.part{display:inline-block;background:var(--lime);color:#1b2e2a;border:2px solid var(--ink);border-radius:30px;padding:5px 16px;font-weight:700;font-size:14px;margin-bottom:14px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mcol{display:flex;flex-direction:column;gap:10px}
.mb{font:600 17px "DM Sans",sans-serif;text-align:left;padding:13px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer;min-height:52px}
.mb.sel{outline:3px solid var(--coral);outline-offset:2px}.mb.on{color:#1b2e2a}.mb i{font-style:normal;font-weight:800}
nav{flex-wrap:wrap}
.gh{font:800 28px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:28px 0 12px}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.gg2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.gc{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:18px 18px 12px}
.gt{margin:0;font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}.gn{color:var(--coral);font-weight:700;margin:2px 0 8px}
.gu{font-size:14px;opacity:.85;font-style:italic;margin:0 0 6px}.gk{font-size:14px;margin:0 0 8px}.gx{font-size:13px;margin:8px 0 0;opacity:.85}
.gr{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px dashed var(--line);padding:8px 0;font:500 17px "DM Sans",sans-serif;color:var(--ink);cursor:pointer;text-align:left}
.gr small{display:block;opacity:.7;font-size:14px}.gs{opacity:.5;flex:none}
.gb{width:100%;border-collapse:collapse;font-size:15px}.gb th,.gb td{text-align:left;padding:7px 6px;border-bottom:0;border-top:1px dashed var(--line)}.gb th{font-size:13px;opacity:.7}.gi td:first-child{font-weight:700}
@media(max-width:900px){.gg{grid-template-columns:repeat(2,1fr)}.gg2{grid-template-columns:1fr}}@media(max-width:600px){.gg{grid-template-columns:1fr}}
.cal{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed}.cal th{font-size:13px;opacity:.7}.cal td{padding:0}
.cal button{width:100%;min-height:58px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:700 16px "DM Sans",sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px}
.cal button.today{border-color:var(--coral)}.cal button.sel{background:var(--lime);color:#1b2e2a;border-color:#1b2e2a}
.dots{display:flex;gap:3px;min-height:8px}.dot{width:8px;height:8px;border-radius:50%;border:1px solid #1b2e2a}
.dot.c{background:var(--lime)}.dot.e{background:var(--sky)}.dot.t{background:var(--gold)}.dot.x2{background:var(--coral)}.dot.x{background:#999}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #1b2e2a;margin-right:5px}
@media(max-width:820px){.cal button{min-height:48px;font-size:14px}.hero{grid-template-columns:1fr}.hr{min-height:420px;border-left:0}.opts,.stats{grid-template-columns:1fr}.res{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav>
  <div class="logo"><i>G</i>GAMENGLISH</div>
  <span class="who" id="who"></span><button class="btn o" id="gramBtn" hidden>📚 Gramática</button><button class="btn o" id="calBtn" hidden>📅 Calendario</button><button class="btn o" id="adminBtn" hidden>⚙️ Administrar</button><button class="btn o" id="logout" hidden>Salir</button>
</nav>

<main id="loginView">
  <header class="hero">
    <div class="hl">
      <h1>Don’t study it.<em>Play it.</em></h1>
      <form class="card" id="loginForm" style="width:100%;max-width:460px">
        <div class="d" style="font-size:32px">Entrar</div>
        <label for="uid">Tu ID</label><input id="uid" autocomplete="username" autocapitalize="none" required>
        <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" type="submit">Empezar a jugar</button>
      </form>
    </div>
    <div class="hr" aria-hidden="true">
      <div class="tag t1">Brilliant!</div><div class="tag t2">No worries.</div><div class="tag t3">You nailed it.</div>
      <div class="bot"><div class="a"></div><div class="a r"></div><div class="h"><b></b></div><div class="b"><span>G!</span></div></div>
    </div>
  </header>
</main>

<main id="appView" class="app" hidden>
  <h2 id="title"></h2>
  <p class="sub" id="sub"></p>
  <div class="pills" id="lvls" role="group" aria-label="Nivel"></div>
  <p class="sub" id="lvlName" style="margin:0"></p>
  <div class="tabs" id="secs" role="group" aria-label="Sección"></div>
  <div id="content"></div>
</main>

<script>
/* ===== DATOS =====
   Los alumnos y materiales se guardan solos en students.json y resources.json de tu repositorio (desde ⚙️ Administrar). */
const BASE=[{id:"profe",name:"Teacher",teacher:true,hash:"3c51b902e98879ba915f25d80d8ca5608a4216aa9f4d3344d1d1d0d4da80c284"}];
let STU=BASE.slice(),RES=[],WORK=[],CAL={classes:[{days:[1,3],start:"17:00",end:"18:00",title:"Clase de inglés",link:""}],events:[],cancelled:[]};
const mergeCal=c=>Object.assign({classes:[{days:[1,3],start:"17:00",end:"18:00",title:"Clase de inglés",link:""}],events:[],cancelled:[]},c);
const merge=j=>{const ids=new Set(j.map(x=>x.id));return BASE.filter(b=>!ids.has(b.id)).concat(j)};
const bust=u=>u+"?t="+Date.now();
const ready=(async()=>{
  try{const r=await fetch(bust("students.json"));if(r.ok)STU=merge(await r.json())}catch(e){}
  try{const r=await fetch(bust("resources.json"));if(r.ok)RES=await r.json()}catch(e){}
  try{const r=await fetch(bust("tasks.json"));if(r.ok)WORK=await r.json()}catch(e){}
  try{const r=await fetch(bust("calendar.json"));if(r.ok){const j=await r.json();if(j&&!Array.isArray(j))CAL=mergeCal(j)}}catch(e){}
})();
/* GitHub API */
const repoInfo=()=>{const o=location.hostname.split(".")[0];let r=location.pathname.split("/")[1]||"";if(!r||r.includes("."))r=o+".github.io";return{o,r}};
const tok=()=>lsGet("gam_token","");
const gh=(path,opt)=>{const{o,r}=repoInfo();return fetch("https://api.github.com/repos/"+o+"/"+r+(path?"/"+path:""),Object.assign({},opt,{headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json","Content-Type":"application/json"}}))};
const b64=t=>btoa(unescape(encodeURIComponent(t)));
const unb64=t=>decodeURIComponent(escape(atob(t.replace(/\n/g,""))));
async function readJson(f){const r=await gh("contents/"+f);if(r.status===404)return{data:[],sha:null};if(!r.ok)throw new Error("No pude leer "+f+" ("+r.status+")");const j=await r.json();return{data:JSON.parse(unb64(j.content)),sha:j.sha}}
async function writeFile(f,content,sha,msg){const body={message:msg,content};if(sha)body.sha=sha;const r=await gh("contents/"+f,{method:"PUT",body:JSON.stringify(body)});if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error("GitHub respondió "+r.status+(m?": "+m:""))}}
async function updateList(f,fn,msg){const{data,sha}=await readJson(f);const nd=fn(data);await writeFile(f,b64(JSON.stringify(nd,null,1)),sha,msg);return nd}

const LEVELS=[["A0","Primeros pasos"],["A1","Principiante"],["A2","Básico"],["B1","Intermedio"],["B2","Intermedio alto"],["C1","Avanzado"],["C2","Maestría"]];
const SECS=[["presentaciones","📊","Presentaciones"],["videos","🎬","Videos"],["guias","📋","Guías"],["juego","🎮","Juego"],["tareas","📝","Tareas"],["pronunciacion","🎙️","Pronunciación"],["examenes","🧪","Exámenes"],["progreso","⭐","Mi progreso"]];
const ICON={presentaciones:"📊",videos:"🎬",guias:"📋",juego:"🎮"};
const BANK=[
["A1","I ___ a student.",["am","is","are","be"],0,"Yo soy estudiante."],
["A1","She ___ tea every morning.",["drink","drinks","drinking","drinked"],1,"Ella toma té cada mañana."],
["A1","There ___ two books on the table.",["is","am","are","be"],2,"Hay dos libros en la mesa."],
["A1","___ is your name?",["Where","What","When","Who are"],1,"¿Cuál es tu nombre?"],
["A2","Let’s ___ a break. I’m tired.",["do","take","make","get"],1,"Tomemos un descanso."],
["A2","Can you give me a ___ with these bags?",["hand","arm","finger","foot"],0,"¿Me das una mano?"],
["A2","That’s a great idea. I’m ___ for it!",["up","in","on","at"],0,"Estoy dispuesto."],
["A2","How long does it ___ to get to the airport?",["spend","take","need","go"],1,"¿Cuánto se tarda?"],
["A2","Sorry I’m late. I got ___ in traffic.",["stuck","caught","held","tied"],0,"Me quedé atorado en el tráfico."],
["A2","I’ll ___ you a call tomorrow.",["make","give","say","tell"],1,"Te llamo mañana."],
["B1","I’m sorry, I didn’t ___ what you said.",["catch","take","hold","pick"],0,"No entendí lo que dijiste."],
["B1","It’s ___ cats and dogs outside.",["falling","raining","pouring","dropping"],2,"Está lloviendo a cántaros."],
["B1","I’m looking ___ to seeing you!",["after","up","forward","out"],2,"Tengo muchas ganas de verte."],
["B1","She’s ___ the weather today. She has a cold.",["under","over","in","below"],0,"Se siente mal."],
["B1","Could you ___ down the music, please?",["turn","go","put","set"],0,"Baja la música."],
["B1","We ran ___ of milk. Can you buy some?",["off","out","away","up"],1,"Se nos acabó la leche."]
];

const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const safe=u=>/^(https?:\/\/|[\w\-./%()]+$)/i.test(u||"");
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

let user,S,lvl="A1",sec="presentaciones",showForm=false,R,view="class";
/* login */
$("loginForm").onsubmit=async e=>{
  e.preventDefault();await ready;
  const id=$("uid").value.trim().toLowerCase(),hs=await sha("gamenglish:"+id+":"+$("pw").value);
  const u=STU.find(s=>s.id.toLowerCase()===id&&s.hash===hs);
  if(!u){$("err").textContent="El ID o la contraseña no son correctos. Revisa ambos e inténtalo otra vez.";return}
  if(u.teacher){try{sessionStorage.setItem("gam_tsession",u.id)}catch(e){}}else lsSet("gam_session",u.id);enter(u);
};
$("logout").onclick=()=>{lsSet("gam_session",null);try{sessionStorage.removeItem("gam_tsession")}catch(e){}location.reload()};
async function refreshAll(){if(!tok())return;try{STU=merge((await readJson("students.json")).data)}catch(e){}try{RES=(await readJson("resources.json")).data}catch(e){}try{WORK=(await readJson("tasks.json")).data}catch(e){}try{const c=(await readJson("calendar.json")).data;if(c&&!Array.isArray(c))CAL=mergeCal(c)}catch(e){}}
$("gramBtn").onclick=()=>{view=view==="grammar"?"class":"grammar";render()};
$("calBtn").onclick=()=>{view=view==="calendar"?"class":"calendar";render();if(view==="calendar"&&user.teacher)refreshAll().then(()=>{if(view==="calendar")render()})};
$("adminBtn").onclick=()=>{view=view==="admin"?"class":"admin";render();if(view==="admin")refreshAll().then(()=>{if(view==="admin")render()})};
function enter(u){
  user=u;S=Object.assign({xp:0,best:0},lsGet("gam_u_"+u.id,{}));
  $("loginView").hidden=true;$("appView").hidden=false;$("logout").hidden=false;$("who").textContent=u.name;$("adminBtn").hidden=!u.teacher;$("calBtn").hidden=false;$("gramBtn").hidden=false;view="class";if(u.teacher)refreshAll().then(()=>{if(user===u)render()});
  $("title").textContent=u.teacher?"Panel del profesor":"Mi clase";
  $("sub").textContent=u.teacher?"Elige un nivel y una sección para agregar tus materiales.":"Elige tu nivel y empieza.";
  render();
}
function save(){lsSet("gam_u_"+user.id,S);const l=lsGet("gam_list",{});l[user.id]={name:user.name,xp:S.xp};lsSet("gam_list",l)}

/* navigation */
function render(){
  const adm=view==="admin"&&user.teacher,cal=view==="calendar",gr=view==="grammar";
  ["lvls","lvlName","secs"].forEach(i=>$(i).hidden=adm||cal||gr);
  $("title").textContent=adm?"Administración":cal?"Calendario":gr?"Tiempos verbales":(user.teacher?"Panel del profesor":"Mi clase");

/* game */
const PRAISE=["Brilliant!","You nailed it.","Nice one!","Spot on."];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function game(C){
  const qs=BANK.filter(q=>q[0]===lvl);
  if(qs.length<4)return;
  const g=h("div","card");g.setAttribute("aria-live","polite");C.appendChild(g);
  R={qs:shuffle(qs).slice(0,8),i:0,score:0,streak:0,g};show();
}
function show(){
  const g=R.g,n=R.qs.length;
  if(R.i>=n){
    if(R.score>S.best){S.best=R.score;save()}
    g.innerHTML="";g.append(h("div","q","Ronda completa: "+R.score+" / "+n),h("p","hint",R.score>=n*.75?"Brilliant work. Your English is sticking.":"No worries. Mistakes are how phrases stick. Try again."));
    const b=h("button","btn","Jugar otra vez");b.onclick=()=>{R.qs=shuffle(R.qs);R.i=0;R.score=0;R.streak=0;show()};g.append(b);return;
  }
  const q=R.qs[R.i],order=shuffle(q[2].map((t,k)=>[t,k]));
  g.innerHTML=`<div class="hud"><span>Pregunta ${R.i+1} de ${n}</span><span>Racha: ${R.streak}</span><span>Puntos: ${R.score}</span></div><div class="bar"><div style="width:${R.i/n*100}%"></div></div><div class="q"></div><div class="hint"></div><div class="opts"></div><div class="fb"></div>`;
  g.querySelector(".q").textContent=q[1];g.querySelector(".hint").textContent="Pista: "+q[4];
  const box=g.querySelector(".opts");
  order.forEach(([t,k])=>{const b=h("button","opt",t);b.onclick=()=>answer(b,k===q[3],box,q,order);box.appendChild(b)});
}
function answer(btn,ok,box,q,order){
  const bs=[...box.children];bs.forEach(b=>b.disabled=true);
  bs.forEach((b,n)=>{if(order[n][1]===q[3])b.classList.add("ok")});
  if(ok){R.score++;R.streak++;S.xp+=10+Math.min(R.streak,5)*2;save()}else{btn.classList.add("no");R.streak=0}
  const fb=R.g.querySelector(".fb");fb.innerHTML=`<b></b><button class="btn" id="next">${R.i===R.qs.length-1?"Ver resultado":"Siguiente"}</button>`;
  fb.querySelector("b").textContent=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"No worries. The answer is “"+q[2][q[3]]+"”.";
  $("next").focus();$("next").onclick=()=>{R.i++;show()};
}

/* ===== herramientas comunes ===== */
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const fdate=s=>{if(!s)return"";const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"})};
const cap=t=>t?t[0].toUpperCase()+t.slice(1):t;
const nrm=t=>t.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]+/g,"");
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const sim=(a,b)=>{a=nrm(a);b=nrm(b);return 1-lev(a,b)/Math.max(a.length,b.length,1)};
const TTS="speechSynthesis" in window;let voice=null;
const pickV=()=>{const v=speechSynthesis.getVoices();voice=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null};
if(TTS){pickV();speechSynthesis.onvoiceschanged=pickV}
function tts(t,r){if(!TTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=r||1;speechSynthesis.speak(u)}
async function shareText(t){if(navigator.share){try{await navigator.share({text:t});return"Enviado."}catch(e){return"Cancelado."}}try{await navigator.clipboard.writeText(t);return"Copiado. Pégalo en un mensaje para tu profe."}catch(e){return t}}
async function shareFiles(files,text){try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text});return"Enviado."}}catch(e){if(e&&e.name==="AbortError")return"Cancelado."}
  files.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()});return"Se descargaron tus grabaciones. Envíaselas a tu profe."}

/* ===== tareas, pronunciación y exámenes ===== */
const WK={tareas:"tarea",pronunciacion:"tarea de pronunciación",examenes:"examen"};
const WIC={tareas:"📝",pronunciacion:"🎙️",examenes:"🧪"};
function parseQ(txt){const qs=[],ls=txt.split("\n").map(x=>x.trim()).filter(Boolean);let part="";
  const P=x=>x.split("|").map(y=>y.trim());
  for(let i=0;i<ls.length;i++){const l=ls[i],E=m=>({err:"Línea "+(i+1)+": "+m});
    if(l.startsWith("##")){part=l.replace(/^#+\s*/,"");continue}
    const mt=l.match(/^([ROLD]):\s*(.*)$/);
    if(mt){const k=mt[1],p=P(mt[2]);
      if(k==="R"){const pr=p.slice(1).map(x=>x.split("=").map(y=>y.trim()));if(!p[0]||pr.length<2||pr.some(x=>x.length<2||!x[0]||!x[1]))return E("usa R: Título | a=b | c=d (mínimo 2 pares).");qs.push({t:"r",q:p[0],pairs:pr,part})}
      else if(k==="O"){if(!p[0]||!p[1]||p[1].split(" ").length<2)return E("usa O: Instrucción | Frase completa en orden.");qs.push({t:"o",q:p[0],s:p[1],part})}
      else if(k==="D"){if(!p[0])return E("escribe el texto que se va a escuchar.");qs.push({t:"w",q:"Escucha y escribe lo que oyes",a:[p[0]],say:p[0],part})}
      else{const o=p.slice(1),st=o.filter(x=>x.endsWith("*"));if(!p[0]||o.length<2||st.length!==1)return E("usa L: Texto a escuchar | opción correcta* | otra | otra.");qs.push({t:"m",q:"Escucha y elige la respuesta",say:p[0],o:o.map(x=>x.replace(/\*$/,"").trim()),c:o.findIndex(x=>x.endsWith("*")),part})}
      continue}
    if(l.includes("=>")){const p=l.split("=>").map(x=>x.trim());if(!p[0]||!p[1])return E("falta la pregunta o la respuesta.");qs.push({t:"w",q:p[0],a:p[1].split("/").map(x=>x.trim()).filter(Boolean),part})}
    else{const p=P(l);if(p.length<3)return E("escribe la pregunta y al menos 2 opciones separadas con |");
      const o=p.slice(1),stars=o.filter(x=>x.endsWith("*"));if(stars.length!==1)return E("marca con * una sola opción correcta.");
      qs.push({t:"m",q:p[0],o:o.map(x=>x.replace(/\*$/,"").trim()),c:o.findIndex(x=>x.endsWith("*")),part})}}
  if(!qs.length)return{err:"Escribe al menos una pregunta."};if(qs.length>100)return{err:"Máximo 100 preguntas."};return{qs}}
const U=w=>w.qs.reduce((a,q)=>a+(q.t==="r"?q.pairs.length:1),0);
const readTxt=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(f)});
function parsePron(txt){const it=txt.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return{en:p[0],es:p[1]||"",p:p[2]||""}});return it.length?{items:it}:{err:"Escribe al menos una palabra o frase."}}

    if(!b.children.length){const tr=h("tr"),td=h("td","","No encontré ese verbo.");td.colSpan=4;tr.append(td);b.append(tr)}};
