<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamenglish – English that sticks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eddc;--ink:#1b2e2a;--coral:#e8694f;--lime:#d4e157;--sky:#82b4da;--gold:#e8b23a;--card:#fffaf0;--line:#1b2e2a33}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14211e;--ink:#f3eddc;--card:#1f332e;--line:#f3eddc33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.d{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.04em;line-height:.95;margin:0}
[hidden]{display:none!important}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 5vw;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:800 18px "Bricolage Grotesque",sans-serif;margin-right:auto}
.logo i{width:38px;height:38px;border-radius:50%;background:var(--lime);color:#1b2e2a;border:2px solid #1b2e2a;display:grid;place-items:center;font-style:normal}
.who{font-weight:700;font-size:15px}
.btn{font:700 16px "DM Sans",sans-serif;background:#1b2e2a;color:#f3eddc;border:0;border-radius:40px;padding:14px 26px;cursor:pointer;box-shadow:5px 5px 0 var(--coral);text-decoration:none;display:inline-block}
.btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--coral)}
.btn.o{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 18px;font-size:15px}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;min-height:640px}
.hl{padding:8vh 5vw 6vh;display:flex;flex-direction:column;justify-content:center;gap:26px}
.hl h1{font-size:clamp(54px,9vw,128px);font-weight:800}
.hl h1 em{color:var(--coral);font-style:italic;display:block;margin-left:.6em}
.hr{background:var(--sky);position:relative;overflow:hidden;min-height:440px;border-left:1px solid var(--line)}
.bot{position:absolute;left:50%;top:50%;width:min(300px,70%);aspect-ratio:1/1.5;transform:translate(-50%,-48%)}
.bot .h{position:absolute;left:18%;top:0;width:64%;aspect-ratio:1;border-radius:50%;background:#fffaf0;border:3px solid #1b2e2a;z-index:2}
.bot .h:before,.bot .h:after{content:"";position:absolute;top:44%;width:7px;height:12px;border-radius:50%;background:#1b2e2a;left:30%}
.bot .h:after{left:auto;right:30%}
.bot .h b{position:absolute;left:36%;right:36%;top:62%;height:14px;border-bottom:3px solid #1b2e2a;border-radius:0 0 50% 50%}
.bot .b{position:absolute;left:5%;right:5%;top:42%;bottom:0;background:var(--coral);border:3px solid #1b2e2a;border-radius:45% 45% 22% 22%/30% 30% 14% 14%}
.bot .b span{position:absolute;left:50%;top:32%;transform:translateX(-50%);width:34%;aspect-ratio:1;border-radius:50%;background:var(--lime);border:3px solid #1b2e2a;display:grid;place-items:center;font:800 26px "Bricolage Grotesque",sans-serif;color:#1b2e2a}
.bot .a{position:absolute;top:52%;width:34%;height:15%;background:#fffaf0;border:3px solid #1b2e2a;border-radius:30px;left:-26%;transform:rotate(-24deg);z-index:1}
.bot .a.r{left:auto;right:-26%;transform:rotate(24deg)}
.tag{position:absolute;font:800 18px "Bricolage Grotesque",sans-serif;padding:10px 16px;border:2.5px solid #1b2e2a;border-radius:8px;color:#1b2e2a;box-shadow:4px 4px 0 #1b2e2a;transform:rotate(-6deg)}
.t1{left:7%;top:16%;background:#fffaf0}.t2{right:5%;top:30%;background:var(--lime);transform:rotate(7deg)}.t3{left:8%;bottom:14%;background:var(--coral);color:#fffaf0;transform:rotate(5deg)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:24px;padding:clamp(18px,3.5vw,34px);box-shadow:7px 7px 0 var(--ink)}
label{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
input,textarea{width:100%;font:500 17px "DM Sans",sans-serif;padding:13px 15px;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink)}
textarea{font:500 13px ui-monospace,Menlo,monospace;height:120px}
.err{color:var(--coral);font-weight:700;min-height:26px;margin:10px 0 0}
.app{max-width:980px;margin:0 auto;padding:30px 5vw 60px}
.app h2{font-size:clamp(36px,5vw,58px);font-weight:800}
.sub{opacity:.75;margin:6px 0 20px}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border:2.5px solid var(--ink);border-radius:22px;background:var(--card);margin-bottom:12px}
.pill{font:800 17px "Bricolage Grotesque",sans-serif;padding:10px 20px;border-radius:14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 24px;border-bottom:2px solid var(--line)}
.tab{font:700 16px "DM Sans",sans-serif;padding:10px 16px;border:0;background:transparent;color:var(--ink);opacity:.65;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tab[aria-pressed=true]{opacity:1;border-bottom-color:var(--coral)}
.res{display:flex;gap:16px;align-items:center;border:2.5px solid var(--ink);border-radius:18px;padding:16px 18px;background:var(--card);margin-bottom:12px}
.res .ic{font-size:30px}.res .rb{flex:1;min-width:0}.res b{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}.res p{margin:2px 0 0;opacity:.75;font-size:15px}
.empty{border:2.5px dashed var(--ink);border-radius:18px;padding:30px;text-align:center;opacity:.8}
.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;margin-bottom:16px}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:24px}
.bar div{height:100%;width:0;background:var(--lime);transition:width .3s}
.q{font:800 clamp(24px,4.5vw,38px)/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.hint{opacity:.7;margin:8px 0 20px;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:500 18px "DM Sans",sans-serif;text-align:left;padding:15px 18px;border:2.5px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--sky);color:#1b2e2a}
.opt.ok{background:var(--lime);color:#1b2e2a}.opt.no{background:var(--coral);color:#fffaf0}
.fb{min-height:56px;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fb b{font:800 22px "Bricolage Grotesque",sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.st{border:2.5px solid var(--ink);border-radius:18px;padding:16px;background:var(--card)}
.st b{display:block;font:800 40px "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hr{min-height:420px;border-left:0}.opts,.stats{grid-template-columns:1fr}.res{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav>
  <div class="logo"><i>G</i>GAMENGLISH</div>
  <span class="who" id="who"></span><button class="btn o" id="adminBtn" hidden>⚙️ Administrar</button><button class="btn o" id="logout" hidden>Salir</button>
</nav>

<main id="loginView">
  <header class="hero">
    <div class="hl">
      <h1>Don’t study it.<em>Play it.</em></h1>
      <form class="card" id="loginForm" style="width:100%;max-width:460px">
        <div class="d" style="font-size:32px">Entrar</div>
        <label for="uid">Tu ID</label><input id="uid" autocomplete="username" autocapitalize="none" required>
        <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" type="submit">Empezar a jugar</button>
      </form>
    </div>
    <div class="hr" aria-hidden="true">
      <div class="tag t1">Brilliant!</div><div class="tag t2">No worries.</div><div class="tag t3">You nailed it.</div>
      <div class="bot"><div class="a"></div><div class="a r"></div><div class="h"><b></b></div><div class="b"><span>G!</span></div></div>
    </div>
  </header>
</main>

<main id="appView" class="app" hidden>
  <h2 id="title"></h2>
  <p class="sub" id="sub"></p>
  <div class="pills" id="lvls" role="group" aria-label="Nivel"></div>
  <p class="sub" id="lvlName" style="margin:0"></p>
  <div class="tabs" id="secs" role="group" aria-label="Sección"></div>
  <div id="content"></div>
</main>

<script>
/* ===== ALUMNOS ===== hash = SHA-256 de "gamenglish:ID:PASSWORD". Agrégalos con el panel Administrar. Ejemplos: profe/profe123 · alumno1/english123 · alumno2/english456 (CÁMBIALAS) */
const STUDENTS=[
 {id:"profe",name:"Teacher",teacher:true,hash:"3c51b902e98879ba915f25d80d8ca5608a4216aa9f4d3344d1d1d0d4da80c284"},
 {id:"alumno1",name:"Alumno 1",hash:"5b7808ea511efba676b8efc8dcc71d43c6218fbda7cff516805d8203f0d365fb"},
 {id:"alumno2",name:"Alumno 2",hash:"59212d2544caca3e0864dce015bd3c1dff8c84c47a84eccc090dd9e5fa860120"},
 {id:"260002",name:"Gema Guadalupe Cervera Basto",hash:"7b7d043f28692eebe3c1d9876369353f7e963b2dbdd908d51f346f1e86ee502d"}
];

/* ===== RECURSOS ===== Lo que ven los alumnos. Se llena desde el panel Administrar (copiar y pegar aquí).
   Ejemplo: {id:"x1",level:"A1",type:"presentaciones",title:"Unit 1 – Greetings",desc:"Saludos y presentaciones",url:"presentaciones/a1-unit1.pdf"} */
const RESOURCES=[
];

const LEVELS=[["A0","Primeros pasos"],["A1","Principiante"],["A2","Básico"],["B1","Intermedio"],["B2","Intermedio alto"],["C1","Avanzado"],["C2","Maestría"]];
const SECS=[["presentaciones","📊","Presentaciones"],["videos","🎬","Videos"],["guias","📋","Guías"],["juego","🎮","Juego"],["progreso","⭐","Mi progreso"]];
const ICON={presentaciones:"📊",videos:"🎬",guias:"📋"};
const BANK=[
["A1","I ___ a student.",["am","is","are","be"],0,"Yo soy estudiante."],
["A1","She ___ tea every morning.",["drink","drinks","drinking","drinked"],1,"Ella toma té cada mañana."],
["A1","There ___ two books on the table.",["is","am","are","be"],2,"Hay dos libros en la mesa."],
["A1","___ is your name?",["Where","What","When","Who are"],1,"¿Cuál es tu nombre?"],
["A2","Let’s ___ a break. I’m tired.",["do","take","make","get"],1,"Tomemos un descanso."],
["A2","Can you give me a ___ with these bags?",["hand","arm","finger","foot"],0,"¿Me das una mano?"],
["A2","That’s a great idea. I’m ___ for it!",["up","in","on","at"],0,"Estoy dispuesto."],
["A2","How long does it ___ to get to the airport?",["spend","take","need","go"],1,"¿Cuánto se tarda?"],
["A2","Sorry I’m late. I got ___ in traffic.",["stuck","caught","held","tied"],0,"Me quedé atorado en el tráfico."],
["A2","I’ll ___ you a call tomorrow.",["make","give","say","tell"],1,"Te llamo mañana."],
["B1","I’m sorry, I didn’t ___ what you said.",["catch","take","hold","pick"],0,"No entendí lo que dijiste."],
["B1","It’s ___ cats and dogs outside.",["falling","raining","pouring","dropping"],2,"Está lloviendo a cántaros."],
["B1","I’m looking ___ to seeing you!",["after","up","forward","out"],2,"Tengo muchas ganas de verte."],
["B1","She’s ___ the weather today. She has a cold.",["under","over","in","below"],0,"Se siente mal."],
["B1","Could you ___ down the music, please?",["turn","go","put","set"],0,"Baja la música."],
["B1","We ran ___ of milk. Can you buy some?",["off","out","away","up"],1,"Se nos acabó la leche."]
];

const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const safe=u=>/^(https?:\/\/|[\w\-./%()]+$)/i.test(u||"");
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

let user,S,lvl="A1",sec="presentaciones",showForm=false,R,view="class";
const drafts=()=>lsGet("gam_drafts",[]);
const allRes=()=>{const ids=new Set(RESOURCES.map(r=>r.id));return RESOURCES.concat(drafts().filter(d=>!ids.has(d.id)))};

/* login */
$("loginForm").onsubmit=async e=>{
  e.preventDefault();
  const id=$("uid").value.trim().toLowerCase(),hs=await sha("gamenglish:"+id+":"+$("pw").value);
  const u=STUDENTS.find(s=>s.id.toLowerCase()===id&&s.hash===hs);
  if(!u){$("err").textContent="El ID o la contraseña no son correctos. Revisa ambos e inténtalo otra vez.";return}
  lsSet("gam_session",u.id);enter(u);
};
$("logout").onclick=()=>{lsSet("gam_session",null);location.reload()};
$("adminBtn").onclick=()=>{view=view==="admin"?"class":"admin";render()};
function enter(u){
  user=u;S=Object.assign({xp:0,best:0},lsGet("gam_u_"+u.id,{}));
  $("loginView").hidden=true;$("appView").hidden=false;$("logout").hidden=false;$("who").textContent=u.name;$("adminBtn").hidden=!u.teacher;view="class";
  $("title").textContent=u.teacher?"Panel del profesor":"Mi clase";
  $("sub").textContent=u.teacher?"Elige un nivel y una sección para agregar tus materiales.":"Elige tu nivel y empieza.";
  render();
}
function save(){lsSet("gam_u_"+user.id,S);const l=lsGet("gam_list",{});l[user.id]={name:user.name,xp:S.xp};lsSet("gam_list",l)}

/* navigation */
function render(){
  const adm=view==="admin"&&user.teacher;
  ["lvls","lvlName","secs"].forEach(i=>$(i).hidden=adm);
  $("title").textContent=adm?"Administración":(user.teacher?"Panel del profesor":"Mi clase");
  $("sub").textContent=adm?"Alumnos y publicación de materiales.":(user.teacher?"Elige un nivel y una sección para agregar tus materiales.":"Elige tu nivel y empieza.");
  $("adminBtn").textContent=adm?"← Volver a la clase":"⚙️ Administrar";
  if(adm){const C=$("content");C.innerHTML="";admin(C);return}
  const L=$("lvls");L.innerHTML="";
  LEVELS.forEach(([k])=>{const b=h("button","pill",k);b.setAttribute("aria-pressed",k===lvl);b.onclick=()=>{lvl=k;showForm=false;render()};L.appendChild(b)});
  $("lvlName").textContent="Nivel "+lvl+" · "+LEVELS.find(x=>x[0]===lvl)[1];
  const T=$("secs");T.innerHTML="";
  const secs=SECS;
  secs.forEach(([k,i,n])=>{const b=h("button","tab",i+" "+n);b.setAttribute("aria-pressed",k===sec);b.onclick=()=>{sec=k;showForm=false;render()};T.appendChild(b)});
  const C=$("content");C.innerHTML="";
  if(ICON[sec])resources(C);else if(sec==="juego")game(C);else if(sec==="progreso")progress(C);else admin(C);
}

/* resources */
function resources(C){
  const ids=new Set(RESOURCES.map(r=>r.id));
  const list=allRes().filter(r=>r.level===lvl&&r.type===sec);
  if(user.teacher){
    const add=h("button","btn",showForm?"Cancelar":"+ Agregar a "+lvl);add.style.marginBottom="18px";
    add.onclick=()=>{showForm=!showForm;render()};C.appendChild(add);
    if(showForm){
      const f=h("form","card");f.style.marginBottom="20px";
      f.innerHTML=`<label>Título</label><input name=t required><label>Enlace (Google Slides, Drive, YouTube o archivo del repositorio)</label><input name=u required placeholder="https://… o presentaciones/a1-unit1.pdf"><label>Descripción (opcional)</label><input name=d><p class="err" id="ferr"></p><button class="btn" type="submit">Guardar</button>`;
      f.onsubmit=e=>{e.preventDefault();const v=f.elements;
        if(!safe(v.u.value.trim())){$("ferr").textContent="Ese enlace no es válido. Debe empezar con https:// o ser un archivo del repositorio.";return}
        const d=drafts();d.push({id:Date.now().toString(36),level:lvl,type:sec,title:v.t.value.trim(),desc:v.d.value.trim(),url:v.u.value.trim()});lsSet("gam_drafts",d);showForm=false;render()};
      C.appendChild(f);
    }
  }
  if(!list.length){C.appendChild(h("div","empty",user.teacher?"Aún no hay nada en "+lvl+". Toca “Agregar” para subir tu primer material.":"Todavía no hay material en este nivel. Tu profe lo subirá pronto."));return}
  list.forEach(r=>{
    const d=h("div","res");d.append(h("div","ic",ICON[r.type]));
    const b=h("div","rb");b.append(h("b","",r.title),h("p","",r.desc||""));d.append(b);
    const a=h("a","btn o","Abrir");if(safe(r.url)){a.href=r.url;a.target="_blank";a.rel="noopener"}d.append(a);
    if(user.teacher&&!ids.has(r.id)){const x=h("button","btn o","Quitar");x.onclick=()=>{lsSet("gam_drafts",drafts().filter(y=>y.id!==r.id));render()};d.append(x)}
    C.appendChild(d);
  });
  if(user.teacher&&list.some(r=>!ids.has(r.id)))C.appendChild(h("p","sub","Los materiales con “Quitar” solo los ves tú. Para que los vean tus alumnos, publícalos desde Administrar."));
}

/* game */
const PRAISE=["Brilliant!","You nailed it.","Nice one!","Spot on."];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function game(C){
  const qs=BANK.filter(q=>q[0]===lvl);
  if(qs.length<4){C.appendChild(h("div","empty","Los juegos del nivel "+lvl+" llegarán pronto. Prueba con A1, A2 o B1."));return}
  const g=h("div","card");g.setAttribute("aria-live","polite");C.appendChild(g);
  R={qs:shuffle(qs).slice(0,8),i:0,score:0,streak:0,g};show();
}
function show(){
  const g=R.g,n=R.qs.length;
  if(R.i>=n){
    if(R.score>S.best){S.best=R.score;save()}
    g.innerHTML="";g.append(h("div","q","Ronda completa: "+R.score+" / "+n),h("p","hint",R.score>=n*.75?"Brilliant work. Your English is sticking.":"No worries. Mistakes are how phrases stick. Try again."));
    const b=h("button","btn","Jugar otra vez");b.onclick=()=>{R.qs=shuffle(R.qs);R.i=0;R.score=0;R.streak=0;show()};g.append(b);return;
  }
  const q=R.qs[R.i],order=shuffle(q[2].map((t,k)=>[t,k]));
  g.innerHTML=`<div class="hud"><span>Pregunta ${R.i+1} de ${n}</span><span>Racha: ${R.streak}</span><span>Puntos: ${R.score}</span></div><div class="bar"><div style="width:${R.i/n*100}%"></div></div><div class="q"></div><div class="hint"></div><div class="opts"></div><div class="fb"></div>`;
  g.querySelector(".q").textContent=q[1];g.querySelector(".hint").textContent="Pista: "+q[4];
  const box=g.querySelector(".opts");
  order.forEach(([t,k])=>{const b=h("button","opt",t);b.onclick=()=>answer(b,k===q[3],box,q,order);box.appendChild(b)});
}
function answer(btn,ok,box,q,order){
  const bs=[...box.children];bs.forEach(b=>b.disabled=true);
  bs.forEach((b,n)=>{if(order[n][1]===q[3])b.classList.add("ok")});
  if(ok){R.score++;R.streak++;S.xp+=10+Math.min(R.streak,5)*2;save()}else{btn.classList.add("no");R.streak=0}
  const fb=R.g.querySelector(".fb");fb.innerHTML=`<b></b><button class="btn" id="next">${R.i===R.qs.length-1?"Ver resultado":"Siguiente"}</button>`;
  fb.querySelector("b").textContent=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"No worries. The answer is “"+q[2][q[3]]+"”.";
  $("next").focus();$("next").onclick=()=>{R.i++;show()};
}

/* progress */
function progress(C){
  const s=h("div","stats");
  [[Math.floor(S.xp/100)+1,"Nivel de juego"],[S.xp,"XP total"],[S.best,"Mejor ronda"]].forEach(([v,l])=>{const d=h("div","st");d.append(h("b","",v),document.createTextNode(l));s.append(d)});
  C.append(s);
  const t=h("div","card");t.innerHTML="<table><thead><tr><th>Jugador</th><th>Nivel</th><th>XP</th></tr></thead><tbody></tbody></table>";
  const rows=Object.values(lsGet("gam_list",{})).sort((a,b)=>b.xp-a.xp);
  const tb=t.querySelector("tbody");
  if(!rows.length){const r=h("tr");const c=h("td","","Juega una ronda para aparecer aquí.");c.colSpan=3;r.append(c);tb.append(r)}
  rows.forEach(p=>{const r=h("tr");[p.name,Math.floor(p.xp/100)+1,p.xp].forEach(v=>r.append(h("td","",v)));tb.append(r)});
  C.append(t);C.append(h("p","sub","La tabla muestra a quienes han jugado en este dispositivo."));
}

/* admin */
const sDrafts=()=>lsGet("gam_sdrafts",[]);
const sLine=s=>" {id:"+JSON.stringify(s.id)+",name:"+JSON.stringify(s.name)+","+(s.teacher?"teacher:true,":"")+"hash:"+JSON.stringify(s.hash)+"}";
function admin(C){
  const ids=new Set(STUDENTS.map(s=>s.id));
  const pend=sDrafts().filter(s=>!ids.has(s.id));
  const all=STUDENTS.concat(pend);
  const a=h("div","card");a.style.marginBottom="22px";
  a.innerHTML=`<div class="d" style="font-size:30px">Alumnos</div><table><thead><tr><th>ID</th><th>Nombre</th><th>Estado</th><th></th></tr></thead><tbody></tbody></table><label for="nid">ID nuevo</label><input id="nid" autocapitalize="none"><label for="nname">Nombre</label><input id="nname"><label for="npw">Contraseña</label><input id="npw"><p class="err" id="aerr"></p><button class="btn" id="add" type="button">Agregar alumno</button>`;
  const tb=a.querySelector("tbody");
  all.forEach(st=>{const r=h("tr");const pub=ids.has(st.id);
    [st.id,st.name,pub?"Publicado":"Falta publicar"].forEach(v=>r.append(h("td","",v)));
    const t=h("td");if(!pub){const x=h("button","btn o","Quitar");x.onclick=()=>{lsSet("gam_sdrafts",sDrafts().filter(y=>y.id!==st.id));render()};t.append(x)}
    r.append(t);tb.append(r)});
  a.querySelector("#add").onclick=async()=>{
    const id=a.querySelector("#nid").value.trim().toLowerCase(),n=a.querySelector("#nname").value.trim(),p=a.querySelector("#npw").value,e=a.querySelector("#aerr");
    if(!id||!n||!p){e.textContent="Llena ID, nombre y contraseña.";return}
    if(/\s/.test(id)){e.textContent="El ID no puede tener espacios.";return}
    if(all.some(x=>x.id.toLowerCase()===id)){e.textContent="Ese ID ya existe.";return}
    const d=sDrafts();d.push({id,name:n,hash:await sha("gamenglish:"+id+":"+p)});lsSet("gam_sdrafts",d);render();
  };
  const ps=h("div","card");ps.style.marginBottom="22px";
  ps.innerHTML=`<div class="d" style="font-size:26px">Publicar alumnos</div><p>Los alumnos con “Falta publicar” todavía no pueden entrar. Copia este texto, abre <b>index.html</b> en GitHub (lápiz de editar), busca <b>const STUDENTS=[</b> y reemplaza <b>todo lo que hay entre los corchetes</b> por este texto. Luego toca Commit.</p><textarea readonly aria-label="Lista de alumnos"></textarea>`;
  ps.querySelector("textarea").value=all.map(sLine).join(",\n");
  const m=h("div","card");
  m.innerHTML=`<div class="d" style="font-size:26px">Publicar materiales</div><p>Lo que agregas en cada nivel solo lo ves tú. Para que lo vean tus alumnos: copia este texto, abre <b>index.html</b>, reemplaza lo que hay entre los corchetes de <b>RESOURCES</b> y toca Commit.</p><textarea readonly aria-label="Código de materiales"></textarea><p style="font-size:15px;opacity:.8">Para subir un PDF o PPTX: en GitHub toca Add file, Upload files, súbelo a la carpeta <b>presentaciones</b> y usa el enlace <b>presentaciones/nombre.pdf</b>. También sirven enlaces de Google Slides o YouTube.</p>`;
  m.querySelector("textarea").value=allRes().map(r=>"  "+JSON.stringify(r)).join(",\n");
  C.append(a,ps,m);
}

const sid=lsGet("gam_session",null);
if(sid){const u=STUDENTS.find(s=>s.id===sid);if(u)enter(u)}
</script>
