<style>

.btn{font:700 16px "DM Sans",sans-serif;background:var(--ink);color:#f3eddc;border:0;border-radius:40px;padding:12px 24px;cursor:pointer;box-shadow:4px 4px 0 var(--coral)}

const norm=s=>s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
const cmp=s=>norm(s).replace(/ /g,"");
const isPh=x=>x.en.split(" ").length>=3&&!/[\/…]/.test(x.en);

const uniq=a=>{const s=new Set();return a.filter(x=>{const k=x.en.toLowerCase();if(s.has(k))return false;s.add(k);return true})};
const few=()=>msg("Este tema no tiene suficientes elementos para este juego. Elige otra unidad o “Toda la A0”.");
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};

const fin=(sc,n,again)=>end("Ronda completa: "+sc+" / "+n,sc>=n*.8?"Brilliant work! Your English is sticking.":"No worries. Practica y vuelve a intentarlo.",again);

function write(){const a=sh(pool.filter(x=>!/[\/…]/.test(x.en)&&x.en.length>2)).slice(0,N);if(a.length<4)return few();typer("Escribe la traducción",a,{prompt:x=>x.es,hint:()=>"Escríbelo en inglés",ans:x=>x.en},write)}

function gaps(){const a=sh(pool.filter(x=>isW(x)&&x.en.length>=4)).slice(0,N);if(a.length<4)return few();

function complete(){

  quiz("Completa la frase",qs,complete)}

function order(){const a=sh(pool.filter(isPh)).slice(0,N);if(a.length<4)return few();builder("Ordena la frase",a,x=>x.en.split(" "),a=>a.join(" "),order,{prompt:x=>x.es})}

function speakGame(){

          const p=el("button","btn sm","▶ Tu voz"),mo=el("button","btn sm o","🔊 Modelo"),y=el("button","btn sm","Lo dije bien ✔"),n=el("button","btn sm o","Necesito practicar ✖");

function genCross(ws,S){
  const g=Array.from({length:S},()=>Array(S).fill("")),dg=Array.from({length:S},()=>Array(S).fill(0)),pl=[];
  const can=(w,r,c,d)=>{const dr=d,dc=1-d,er=r+dr*(w.length-1),ec=c+dc*(w.length-1);if(r<0||c<0||er>=S||ec>=S)return false;
    const br=r-dr,bc=c-dc,ar=er+dr,ac=ec+dc;if((br>=0&&bc>=0&&g[br][bc])||(ar<S&&ac<S&&g[ar][ac]))return false;
    let x=0;for(let k=0;k<w.length;k++){const rr=r+dr*k,cc=c+dc*k,ch=g[rr][cc];
      if(ch){if(ch!==w[k]||(dg[rr][cc]&(d+1)))return false;x++}
      else{const pr=rr+dc,pc=cc+dr,nr=rr-dc,nc=cc-dr;if((pr<S&&pc<S&&g[pr][pc])||(nr>=0&&nc>=0&&g[nr][nc]))return false}}
    return pl.length===0||x>0};
  const put=(it,w,r,c,d)=>{for(let k=0;k<w.length;k++){const rr=r+d*k,cc=c+(1-d)*k;g[rr][cc]=w[k];dg[rr][cc]|=d+1}pl.push({it,w,r,c,d})};
  ws.forEach(it=>{const w=it.en.toUpperCase();if(pl.length>=10)return;
    if(!pl.length){put(it,w,S>>1,(S-w.length)>>1,0);return}
    const opts=[];pl.forEach(p=>{for(let a=0;a<p.w.length;a++)for(let b=0;b<w.length;b++)if(p.w[a]===w[b]){
      const d=1-p.d,pr=p.r+p.d*a,pc=p.c+(1-p.d)*a,r=pr-d*b,c=pc-(1-d)*b;if(can(w,r,c,d))opts.push([r,c,d])}});
    if(opts.length){const o=opts[Math.random()*opts.length|0];put(it,w,o[0],o[1],o[2])}});
  return pl;
}
function crossword(){
  const cand=uniq(sh(pool.filter(x=>/^[A-Za-z]{3,10}$/.test(x.en)))).slice(0,18);
  if(cand.length<6)return few();
  let pl=[];for(let t=0;t<40;t++){const r=genCross(sh(cand).sort((a,b)=>b.en.length-a.en.length+(Math.random()-.5)*4),21);if(r.length>pl.length)pl=r;if(pl.length>=9)break}
  if(pl.length<4)return few();
  const eR=p=>p.r+p.d*(p.w.length-1),eC=p=>p.c+(1-p.d)*(p.w.length-1);
  const r0=Math.min(...pl.map(p=>p.r)),c0=Math.min(...pl.map(p=>p.c)),R=Math.max(...pl.map(eR))-r0+1,C=Math.max(...pl.map(eC))-c0+1;
  const L={},at={},starts={};
  pl.forEach(p=>{for(let k=0;k<p.w.length;k++){const key=(p.r-r0+p.d*k)+","+(p.c-c0+(1-p.d)*k);L[key]=p.w[k];(at[key]=at[key]||[]).push(p)}starts[(p.r-r0)+","+(p.c-c0)]=1});
  let num=0;const nums={};for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(starts[r+","+c])nums[r+","+c]=++num;
  pl.forEach(p=>p.n=nums[(p.r-r0)+","+(p.c-c0)]);
  m.innerHTML="";const tb=topbar("Crucigrama","");m.append(tb);
  const wrap=el("div","sc"),tbl=el("table","xw"),inp={};let curD=0;
  for(let r=0;r<R;r++){const tr=el("tr");for(let c=0;c<C;c++){const key=r+","+c,td=el("td");
    if(L[key]){td.className="l";if(nums[key])td.append(el("sup","",nums[key]));
      const i=el("input");i.maxLength=2;i.autocomplete="off";i.setAttribute("aria-label","Letra "+(r+1)+","+(c+1));inp[key]=i;td.append(i);
      const step=(d,s)=>{const nk=(r+d*s)+","+(c+(1-d)*s);if(inp[nk])inp[nk].focus()};
      i.onfocus=()=>{const ds=at[key].map(p=>p.d);if(!ds.includes(curD))curD=ds[0];i.select()};
      i.oninput=()=>{const v=i.value.replace(/[^a-zA-Z]/g,"").slice(-1).toUpperCase();i.value=v;td.className="l";if(v)setTimeout(()=>step(curD,1),0)};
      i.onkeydown=e=>{if(e.key==="Backspace"&&!i.value)step(curD,-1)}}
    tr.append(td)}tbl.append(tr)}
  wrap.append(tbl);m.append(wrap);
  const row=el("div","row"),chk=el("button","btn","Revisar"),hint=el("button","btn o sm","💡 Pista"),dir=el("button","btn o sm","↔ ↕ Cambiar dirección"),nw=el("button","btn o sm","Nuevo crucigrama"),st=el("p","hint","");
  row.append(chk,hint,dir,nw);m.append(row,st);
  const cells=()=>Object.keys(L).map(k=>[k,inp[k],inp[k].parentNode]);
  chk.onclick=()=>{let all=true;cells().forEach(([k,i,td])=>{const v=i.value.toUpperCase();td.className="l"+(v?(v===L[k]?" ok":" no"):"");if(v!==L[k])all=false});
    st.textContent=all?"¡Lo lograste! +40 XP":"Las rojas están mal; las verdes, bien.";if(all){addXP(40);setTimeout(()=>end("¡Crucigrama completo!","+40 XP",crossword),900)}};
  hint.onclick=()=>{const e=cells().filter(([k,i])=>i.value.toUpperCase()!==L[k]);if(e.length){const [k,i]=e[Math.random()*e.length|0];i.value=L[k];i.focus()}};
  dir.onclick=()=>{curD=1-curD;st.textContent=curD?"Escribirás hacia abajo ↓":"Escribirás hacia la derecha →"};
  nw.onclick=crossword;
  const cl=el("div","clues");[["→ Horizontales",0],["↓ Verticales",1]].forEach(([t,d])=>{const col=el("div");col.append(el("h4","",t));
    pl.filter(p=>p.d===d).sort((a,b)=>a.n-b.n).forEach(p=>{const q=el("p","",p.n+". "+p.it.es+" ("+p.w.length+") ");const b=el("button","btn sm o","🔊");b.setAttribute("aria-label","Escuchar");b.onclick=()=>say(p.it.s,.8);q.append(b);col.append(q)});cl.append(col)});
  m.append(cl);
}

function wordsearch(){
  const cand=uniq(sh(pool.filter(x=>/^[A-Za-z]{3,9}$/.test(x.en)))).slice(0,8);if(cand.length<5)return few();
  const S=12,g=Array.from({length:S},()=>Array(S).fill("")),D4=[[0,1],[1,0],[1,1],[-1,1]],pl=[];
  cand.forEach(it=>{const w=it.en.toUpperCase();for(let t=0;t<300;t++){const d=D4[Math.random()*4|0],r=Math.random()*S|0,c=Math.random()*S|0,er=r+d[0]*(w.length-1),ec=c+d[1]*(w.length-1);
    if(er<0||er>=S||ec>=S)continue;let ok=true;for(let k=0;k<w.length;k++){const ch=g[r+d[0]*k][c+d[1]*k];if(ch&&ch!==w[k]){ok=false;break}}if(!ok)continue;
    for(let k=0;k<w.length;k++)g[r+d[0]*k][c+d[1]*k]=w[k];pl.push({it,w});break}});
  for(let r=0;r<S;r++)for(let c=0;c<S;c++)if(!g[r][c])g[r][c]="ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.random()*26|0];
  m.innerHTML="";m.append(topbar("Sopa de letras",""));
  m.append(el("p","hint","Toca la primera letra y luego la última letra de la palabra."));
  const st=el("p","note","");st.setAttribute("aria-live","polite");
  const tbl=el("table","ws"),B=[];let sel=null;const found=new Set(),chips={};
  for(let r=0;r<S;r++){const tr=el("tr");B[r]=[];for(let c=0;c<S;c++){const td=el("td"),b=el("button","",g[r][c]);b.setAttribute("aria-label",g[r][c]);B[r][c]=b;
    b.onclick=()=>{if(!sel){sel=[r,c];b.classList.add("s");return}
      const r1=sel[0],c1=sel[1];sel=null;B[r1][c1].classList.remove("s");
      const dr=Math.sign(r-r1),dc=Math.sign(c-c1),n=Math.max(Math.abs(r-r1),Math.abs(c-c1))+1;
      if(n<2||(r!==r1&&c!==c1&&Math.abs(r-r1)!==Math.abs(c-c1))){st.textContent="Elige la primera y la última letra en línea recta.";return}
      let s="";for(let k=0;k<n;k++)s+=g[r1+dr*k][c1+dc*k];
      const hit=pl.find(p=>!found.has(p.w)&&(p.w===s||p.w===[...s].reverse().join("")));
      if(hit){found.add(hit.w);for(let k=0;k<n;k++)B[r1+dr*k][c1+dc*k].classList.add("f");chips[hit.w].classList.add("f");addXP(10);st.textContent="¡Encontraste “"+hit.it.en+"”! "+hit.it.p;say(hit.it.s,1);
        if(found.size===pl.length){addXP(30);setTimeout(()=>end("¡Completaste la sopa de letras!","+30 XP extra",wordsearch),1200)}}
      else st.textContent="Esa no está en la lista. Intenta otra."};
    td.append(b);tr.append(td)}tbl.append(tr)}
  const sc=el("div","sc");sc.append(tbl);m.append(sc,st);
  const wl=el("div","wl");pl.forEach(p=>{const s=el("span","",p.it.en+" = "+p.it.es);chips[p.w]=s;wl.append(s)});m.append(wl);
  const nw=el("button","btn o sm","Nueva sopa");nw.style.marginTop="14px";nw.onclick=wordsearch;m.append(nw);
}
